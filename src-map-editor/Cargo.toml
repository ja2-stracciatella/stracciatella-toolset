[package]
name = "ja2-map-editor"
version = "0.0.1"
authors = ["Stefan Lau <github@stefanlau.com>"]
description = "Tactical map viewer of the stracciatella toolset, compiled to wasm"
license = "MIT OR Apache-2.0"
edition.workspace = true
rust-version.workspace = true

[lib]
# The rlib is only for the benchmark example
crate-type = ["cdylib", "rlib"]
# The doc examples are from the stracciatella crate, they were never run as a cdylib
doctest = false

[features]
# Native GPU memory benchmark, see the README
bench = []

[[example]]
name = "bench"
required-features = ["bench"]

[dependencies]
bevy = { version = "0.20.0", default-features = false, features = [
    "default_app",
    "default_platform",
    "2d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "webgpu",
    "web",
] }
bitflags = "2"
byteorder = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Must match the wasm-bindgen CLI, see .erb/scripts/build-map-editor.mts
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
